<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mapa de Bogotá</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<link
		href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0,0"
		rel="stylesheet"
	>

	<link rel="stylesheet" href="styles.css">
</head>

<body>

	<main id="map" aria-label="Mapa de Bogotá"></main>

	<nav class="map-toolbar" aria-label="Controles del mapa">

		<!-- Botón 2D / 3D -->
		<glass-element
			class="glass-control mode-control"
			auto-size
			radius="999"
			blur="1"
			depth="8"
			strength="32"
			chromatic-aberration="3"
			background-color="transparent"
			style="--glass-padding: 0;"
		>
			<button
				id="mode-toggle"
				class="map-button mode-button"
				type="button"
				aria-label="Cambiar vista"
			>
				<span
					id="mode-label"
					class="material-symbols-rounded mode-icon"
					aria-hidden="true"
				>view_in_ar</span>
			</button>
		</glass-element>

		<!-- Controles de navegación -->
		<glass-element
			class="glass-control navigation-control"
			auto-size
			radius="999"
			blur="1"
			depth="8"
			strength="32"
			chromatic-aberration="3"
			background-color="transparent"
			style="--glass-padding: 0;"
		>
			<div
				class="map-button-group"
				role="group"
				aria-label="Navegación del mapa"
			>

				<button
					id="zoom-in"
					class="map-button"
					type="button"
					title="Acercar"
					aria-label="Acercar"
				>
					<span
						class="material-symbols-rounded button-icon"
						aria-hidden="true"
					>add</span>
				</button>

				<button
					id="zoom-out"
					class="map-button"
					type="button"
					title="Alejar"
					aria-label="Alejar"
				>
					<span
						class="material-symbols-rounded button-icon"
						aria-hidden="true"
					>remove</span>
				</button>

				<button
					id="rotate-map"
					class="map-button"
					type="button"
					title="Girar mapa"
					aria-label="Girar mapa"
				>
					<span
						class="material-symbols-rounded button-icon"
						aria-hidden="true"
					>360</span>
				</button>

			</div>
		</glass-element>

	</nav>

	<script src="liquidglass/displacement-utils.js"></script>
	<script src="liquidglass/glass-element.js"></script>
	<script src="config.js"></script>
	<script src="map.js"></script>
	<script src="app.js"></script>

</body>
</html>
